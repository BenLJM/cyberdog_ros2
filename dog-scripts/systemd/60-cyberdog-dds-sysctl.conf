# ⚠️ 2026-07-26 状态: **本文件已被 /etc/sysctl.d/99-cyberdog.conf 取代, 不要再装。**
#    0725 已经有另一路把 net.core.rmem_max/rmem_default=26214000 写进 99-cyberdog.conf 并生效。
#    99 > 60, 两个都装的话 99 赢, 但同一参数两处定义纯属给后人挖坑。
#    本文件保留只为两个用途: (1) 记录这条移植漏项的来龙去脉; (2) 万一 99-cyberdog.conf
#    被谁删了, 这里有可直接安装的等价物。d455-deploy.sh sysctl 会先检查, 已达标就拒绝安装。
#    另: wmem_max 本轮**未被证明有必要** —— rmem 补齐后 848x480@30 三路影像已满速,
#    wmem 仍停在 212992 也没事(DDS 发送侧是 ~1.4KB 分片, 不吃大发送缓冲)。
#
# /etc/sysctl.d/60-cyberdog-dds.conf   —— 装在 **JP5 host** 上
#
# 出厂 JP4 rootfs 的 /etc/sysctl.conf 第 78/79 行本来就有前两行:
#     net.core.rmem_max=26214000
#     net.core.rmem_default=26214000
# 那是小米为了让 DDS 扛得住相机图像帧特意调的。移植到 JP5 后:
#   - chroot 里不跑 systemd-sysctl, p1 的 sysctl.conf 永远不生效
#   - JP5 host 自己的 rootfs 里也没有这两行
# 于是 net.core.rmem_max 停在内核默认 212992 B(208KB)。
#
# 后果(2026-07-25 实测):
#   848x480 Z16 深度帧 = 814080 B  -> 10 秒只投递出 1 帧(近乎完全不通)
#   424x240 Z16 深度帧 = 203520 B  -> 30.1 Hz 满速
# 也就是说这条漏项把 JP5 上所有 ROS2 大消息(相机图像/点云/激光)全掐在 208KB 以下。
#
# 装法(需 root, 立即生效且开机自动生效, 不用重启):
#     sudo install -m 0644 60-cyberdog-dds-sysctl.conf /etc/sysctl.d/60-cyberdog-dds.conf
#     sudo sysctl --system
# 回滚:
#     sudo rm /etc/sysctl.d/60-cyberdog-dds.conf && sudo reboot   # 或手工 sysctl -w 改回
#     (不重启也可: sysctl -w net.core.rmem_max=212992 net.core.rmem_default=212992
#                          net.core.wmem_max=212992)
#
# ⚠️ 前两行是**照抄出厂值**, 同一块硬件上跑了多年。第三行 wmem 是本次新增
#    (出厂没设; 大样本分片发送侧同样需要发送缓冲), 保守起见只给 8MB。

net.core.rmem_max = 26214000
net.core.rmem_default = 26214000
net.core.wmem_max = 8388608
