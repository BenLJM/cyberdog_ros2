on:
  pull_request:
  push:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04]
      fail-fast: false
    steps:
      - name: Setup ROS 2
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libssl-dev \
            libconsole-bridge-dev \
            liblog4cxx-dev \
            libeigen3-dev \
            libtinyxml2-dev \
            libboost-all-dev \
            libprotobuf-dev \
            libprotoc-dev \
            protobuf-compiler
      - name: build and test
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          target-ros2-distro: humble
          package-name: >-
            motion_msgs
            ception_msgs
            interaction_msgs
            cascade_lifecycle_msgs
            automation_msgs
            cyberdog_interfaces
            cyberdog_utils
            cyberdog_decisionutils
          skip-tests: false
      - name: Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ros_ws/lcov/total_coverage.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
