on:
  pull_request:
  push:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04]
      fail-fast: false
    steps:
      - name: Setup ROS 2
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble
      - name: build
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          target-ros2-distro: humble
          package-name: >-
            motion_msgs
            ception_msgs
            interaction_msgs
            cascade_lifecycle_msgs
            automation_msgs
            cyberdog_interfaces
            cyberdog_utils
            cyberdog_decisionutils
          # Skip tests: ament_lint checks (copyright, cpplint, uncrustify,
          # flake8, etc.) fail on legacy code and are out of scope for this
          # migration. Unit tests require a full robot environment.
          skip-tests: true
