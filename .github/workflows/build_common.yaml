on:
  pull_request:
  push:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04]
      fail-fast: false
    steps:
      - name: Setup ROS 2
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble
      - name: build
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          target-ros2-distro: humble
          # Build only pure message/interface packages to validate
          # ROS2 Humble message generation. C++ packages excluded
          # as they require hardware-specific deps (CUDA, CAN, etc.)
          package-name: >-
            motion_msgs
            ception_msgs
            interaction_msgs
            cascade_lifecycle_msgs
            automation_msgs
            cyberdog_interfaces
          skip-tests: 'true'
