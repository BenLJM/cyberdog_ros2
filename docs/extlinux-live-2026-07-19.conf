# Live eMMC APP p1 (boot pivot) extlinux.conf — archived 2026-07-19 from the dog
# (post-Phase-2 state: LABEL jp5 below is the 2026-07-11 PROOF-MODE placeholder —
#  JP4 kernel bytes, stock initrd, root=p1. Phase 4 must rewrite the whole stanza.
#  See PHASE2_RUNBOOK §2 blueprint + RETROSPECTIVE-2026-07-19 H4.)

TIMEOUT 10
DEFAULT primary

MENU TITLE L4T boot options

LABEL primary
      MENU LABEL primary kernel
      INITRD /boot/initrd
      APPEND ${cbootargs} quiet root=/dev/nvme0n1p1 rw rootwait rootfstype=ext4 console=ttyTCU0,115200n8 console=tty0 fbcon=map:0 net.ifnames=0 

# When testing a custom kernel, it is recommended that you create a backup of
# the original kernel and add a new entry to this file so that the device can
# fallback to the original kernel. To do this:
#
# 1, Make a backup of the original kernel
#      sudo cp /boot/Image /boot/Image.backup
#
# 2, Copy your custom kernel into /boot/Image
#
# 3, Uncomment below menu setting lines for the original kernel
#
# 4, Reboot

# LABEL backup
#    MENU LABEL backup kernel
#    LINUX /boot/Image.backup
#    INITRD /boot/initrd
#    APPEND ${cbootargs}

LABEL second
	MENU LABEL second kernel
	LINUX /boot/Image
	INITRD /boot/initrd
	APPEND ${cbootargs} quiet root=/dev/nvme0n1p1 rw rootwait rootfstype=ext4 console=ttyTCU0,115200n8 console=tty0 fbcon=map:0 net.ifnames=0 

LABEL rescue
	MENU LABEL RESCUE (RAM, JP4 kernel, no NVMe mount)
	LINUX /boot/Image
	FDT /boot/tegra194-mi-k91.dtb
	INITRD /boot/initrd-rescue
	APPEND ${cbootargs} rw rootwait console=ttyTCU0,115200n8 console=tty0 fbcon=map:0 net.ifnames=0 cyberdog.rescue=1

LABEL jp5
	MENU LABEL jp5 slot (NOW: LINUX/FDT-from-file proof with JP4 kernel copy)
	LINUX /boot-jp5/Image
	FDT /boot-jp5/tegra194-mi-k91.dtb
	INITRD /boot/initrd
	APPEND ${cbootargs} quiet root=/dev/nvme0n1p1 rw rootwait rootfstype=ext4 console=ttyTCU0,115200n8 console=tty0 fbcon=map:0 net.ifnames=0

